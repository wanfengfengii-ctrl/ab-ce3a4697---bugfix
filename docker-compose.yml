services:
  api:
    build: .
    environment:
      PORT: ${API_PORT:-8000}
    ports:
      - "${HOST_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      # The check passes only after the startup self-check flips readiness;
      # retries cover the brief window before uvicorn accepts connections.
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 1s
    restart: unless-stopped

  verify:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:${API_PORT:-8000}
      CLEARANCE: ${VERIFY_CLEARANCE:-2}
    # One-shot verification: tests, build check, collision-constrained API
    # smoke; the service exits and its code aggregates success/failure.
    command:
      - sh
      - -c
      - |
        set -e
        echo "==> [1/3] code tests"
        python -m pytest -q tests
        echo "==> [2/3] application import/build check"
        python -m compileall -q app scripts tests
        python -c "from app.main import app; print('app import ok:', app.title)"
        echo "==> [3/3] API smoke (reach + uniqueness + clearance)"
        python scripts/smoke.py
        echo "==> verify passed"
